  <body>

    <div class="container">
	<h1>Color Name Summaries</h1>
	<p style="margin-bottom: 5px;">This page lets you see color names in different languages</p>

  <div class="form-check form-check-inline">
    <input type="radio" class="btn-check" value="hue-data" name="rgb-set" id="hue-data" autocomplete="off" >
    <label class="btn btn-outline-primary btn-sm" for="hue-data">Hue Data</label>

    <input type="radio" class="btn-check" value="full-data" name="rgb-set" id="full-data" autocomplete="off">
    <label class="btn btn-outline-primary btn-sm" for="full-data">Full Color Data</label>

    <input type="radio" class="btn-check" value="both-hue-full" name="rgb-set" id="both-hue-full" autocomplete="off" checked>
    <label class="btn btn-outline-primary btn-sm" for="both-hue-full">Both Data Sets</label>
  </div>


  <div class="form-check form-check-inline justify-content-center align-items-center flex-nowrap">
    <div class="small" style="max-width:500px;margin:auto;">
      <select class="form-select form-select-sm" aria-label="language" name ="selected_langs" id="selected_langs" value="selected_langs" style="width:100%">
        </select> 
    </div>
  </div>

  <button id="download_language_subset_button" title="download" aria-label="download" class="btn btn-outline-secondary btn-sm p-1">

  <div id="data_view">
    <span id="loading-data-span">Loading...</span>
    <div id="data_table"></div>
  </div>
  
  <div class="modal" id="advanced_settings_modal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Settings</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="form-check"> 
            <input class="form-check-input" type="checkbox" name="hue_bins_in_circle" id="hue_bins_in_circle" value="hue_bins_in_circle" checked>
            <label class="form-label" for="hue_bins_in_circle">Hue bins in circle</label>
          </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
