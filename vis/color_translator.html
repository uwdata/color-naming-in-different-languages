<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Color Translator - Many Languages, Many Colors</title>
<meta name="og:description" content="Translate color names from one language to another or find synonyms in the same language.">
<meta name="og:image" content="imgs/color-translator-small.png">

<link rel="icon" href="../favicon.ico" type="image/x-icon" />
<link href="css-lib/bootstrap.min.css" rel="stylesheet">

<script src="js-lib/jquery-1.12.0.min.js"></script>
<script src="js-lib/bootstrap.bundle.min.js"></script>

<script src="js-lib/jquery-ui.min.js"></script>
<link href="css-lib/jquery-ui.min.css" rel="stylesheet" />
<script>
$( function() {
$( document ).tooltip({
	track: true, 
	show: false, hide:false,
	classes: {
	"ui-tooltip": "small"
	}
});
} );
</script>



<script src="js-lib/d3.min.js"></script>
<link href="css-lib/select2.min.css" rel="stylesheet" />
<script src="js-lib/select2.min.js"></script>

<script src="js-lib/color.global.js"></script>
<!-- <script type="module" src="../shared_files/SOM.js"></script> -->
<script type="module" src="js/color-translator.js"></script>

<script src="../addNavBar.js"></script>


<style>
.select2-container--default .select2-results > .select2-results__options {
    max-height: 400px;
    min-height: 200px;
    overflow-y: auto;
}

.select2-results__option {
	padding-top:1px;
	padding-bottom:1px;
}

.subtle-link {
	color: black
}

.subtle-link:hover {
  color: black
}
</style>
</head>

<body>
 <div id = "main" class="container" style="height:100%">

 <h1 style="margin-bottom:0px;">Color Translator</h1>
 <p>Choose a start color and destination language, and we will show you the most similar colors.</p>
 <div class="row" style="height:100%">
 <div class="col-12 col-md-6">
	 <label>Start Language</label>
	 <select id="startLang"></select>
	 <br>
	 <label>Start Term</label>
	 <select id="startTerm"  class="js-example-basic-single" style="width:250px">

	 </select>
	 <div id="startColorInfo">
		<strong>Loading...</strong>
	 </div>


 </div>
 
 <hr class="d-block d-md-none col-12">


  <div class="col-12 col-md-6" style="height:100%">
	 <label>Destination Language</label>
	 <select id="destLang"> </select>
	 <div id="results" style="overflow-y: auto; height:100%; max-height:500px"> <strong>Loading...</strong></div>
 </div>

 </div></div>
</body>
</html>
