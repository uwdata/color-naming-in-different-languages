<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <title>Full Color Bin Options- Color Naming in Different Language</title>
    <meta name="og:description" content="Explore different options for binning and visualizing the full color spectrum.">
    <meta name="og:image" content="imgs/full-color-bin-viewer-small.png">
	
	<link rel="icon" href="../favicon.ico" type="image/x-icon" />

    <!-- Bootstrap -->
    <link href="css-lib/bootstrap.min.css" rel="stylesheet">
    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
	<script src="js-lib/jquery-1.12.0.min.js"></script>
  <link href="css-lib/select2.min.css" rel="stylesheet" />
  <script src="js-lib/select2.min.js"></script>
	<script src="js-lib/bootstrap.bundle.min.js"></script>

  <script src="js-lib/jquery-ui.min.js"></script>
  <link href="css-lib/jquery-ui.min.css" rel="stylesheet" />
  <script>
  $( function() {
    $( document ).tooltip({
      track: true, 
      show: false, hide:false,
      classes: {
        "ui-tooltip": "small"
      }
    });
  } );
  </script>
  <style>
    .ui-tooltip-content {
      font-size:10pt;
      white-space: pre-line;
      font-family:Calibri;
    }

    .form-label{
      padding-right:5px;
    }
  </style>


  <script src="js-lib/d3.v7.min.js"></script>
	
  <script type="module" src="js/full-color-bins-viewer.js"></script>
	
	<script src="../addNavBar.js"></script>
  </head>
  <body>

    <div class="container" id="main" style="max-width: unset;">
	    <h1>Full Color Bin Options</h1>
      <p>This is for exploring different options for binning and visualizing the whole color spectrum.
        <!-- 
        For some reason, i need a tagged image with full gamut for wider gamut to display,
        so I use a 1 px thumbnail of this image
        https://commons.wikimedia.org/wiki/File:Bt.2020_RGB_color_cube.png -->
        <img src="imgs/Bt.2020_RGB_color_cube.png" />
      </p>
      <p>Each tile represents a equal volume bin in the perceptually uniform <a href="https://en.wikipedia.org/wiki/Oklab_color_space" target="_blank">Oklab / Oklch color spaces</a>. The bins shown are all bins that contain any HDR high-gamut P3 or Rec. 2020 colors.</p>

      <div id="controllers">
        <div class="form-check form-check-inline"> 
          <label class="form-label" for="background-brightness">Background Brightness 
          </label>
          <input class="" type="range" id="background-brightness" name="background-brightness" min="0" max="100" value="100" />
        </div>
        <div class="form-check form-check-inline">
          <label class="form-label" for="bin_size">LAB bin size</label> 
          <select class="form-select w-auto d-inline-block small" id="bin_size" value="bin_size">
          </select>
        </div>
        <div class="form-check form-check-inline">
          <input type="radio" class="btn-check" value="srgb" name="color-gamut" id="srgb" autocomplete="off" checked>
          <label class="btn btn-outline-primary" for="srgb">sRGB</label>

          <input type="radio" class="btn-check" value="p3" name="color-gamut" id="p3" autocomplete="off">
          <label class="btn btn-outline-primary" for="p3">Display P3</label>

          <input type="radio" class="btn-check" value="rec2020" name="color-gamut" id="rec2020" autocomplete="off">
          <label class="btn btn-outline-primary" for="rec2020">Rec. 2020</label>
        </div>
        <div class="form-check form-check-inline"> 
          <label class="form-label" for="show-3d">Show 3D bins <em></em>(not fully functional)</em>
          </label>
          <input class="form-check-input" type="checkbox" id="show-3d" name="background-brightness"  />
        </div>
      </div>
      </div>    

    </div>

  </body>
</html>
