  <style>
    th{
      vertical-align: bottom;
    }
    th,td{
      padding: 5px;
      text-align: center;
    }
    tr{
      border: solid black 1px
    }
    td{
      border: solid black 1px

  <body>

    <div class="container">
      <h1>Cleaned Data Viewer</h1>
      <p>This page lets you see the results of our data celeaning</p>

      <div id="controllers" style="text-align: center;">
        <div class="form-check justify-content-center align-items-center flex-nowrap">
          <label class="form-label" for="selected_langs" style="display: block; text-align: center;" >Viewed Languages</label>
          <div class="small" style="max-width:500px;margin:auto;">
            <select class="form-select small" name ="selected_langs" id="selected_langs" value="selected_langs" style="width:100%"></select>
          </div>
        </div>
        <div class="form-check form-check-inline">
          <input type="radio" class="btn-check" value="cleaned" name="cleaned-or-deleted" id="cleaned-data" autocomplete="off" checked>
          <label class="btn btn-outline-primary" for="cleaned-data">Cleaned Data</label>

          <input type="radio" class="btn-check" value="removed" name="cleaned-or-deleted" id="removed-data" autocomplete="off">
          <label class="btn btn-outline-primary" for="removed-data">Removed Data</label>
        </div>
      </div>

      <div>
        <div id="min_name_count_div" class="form-check form-check-inline"> 
          <label class="form-label" for="min_name_count">Minimum data count 
          </label>
          <input type="number" id="min_name_count" name="min_name_count" min="1" value="1" />
        </div>
        <div id="filter_lang_note"></div>
      </div>
      

      <div id="data_view">Loading...</div>


      <div class="modal modal-dialog-scrollable" id="standardized-name-modal" tabindex="-1">
        <div class="modal-dialog modal-fullscreen">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Color Summary</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <table>
              </table>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn download btn-primary">Download</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
      </div>


      <div class="modal modal-dialog-scrollable" id="participant-info-modal" tabindex="-1">
        <div class="modal-dialog modal-fullscreen">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Participant Summary</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="cleaned-data">
                <h3>Cleaned Data</h3>
                <table>
                </table>
              </div>
              <div class="removed-data">
                <h3>Removed Data</h3>
                <table>
                </table>
              </div>
            </div>
            <div class="modal-footer">
              <!-- <button type="button" class="btn download btn-primary">Download</button> -->
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
      </div>

    </div>
